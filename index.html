<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gutendex Books Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .page-enter-active, .page-leave-active {
            transition: opacity 0.3s, transform 0.3s;
        }
        .page-enter-from, .page-leave-to {
            opacity: 0;
            transform: translateY(10px);
        }
    </style>
</head>
<body class="bg-gray-50">
    <nav class="bg-white shadow-sm">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="index.html" class="text-xl font-bold text-indigo-600">Gutendex Books</a>
            <div class="flex space-x-6">
                <a href="index.html" class="text-gray-600 hover:text-indigo-600 font-medium">Home</a>
                <a href="wishlist.html" class="text-gray-600 hover:text-indigo-600 font-medium">Wishlist</a>
            </div>
        </div>
    </nav>
    <div id="notification" class="fixed bottom-4 right-4 bg-green-500 text-white px-4 py-2 rounded-md shadow-lg transform translate-y-10 opacity-0 transition-all duration-300 z-50 hidden">
        Book added to wishlist! dd
    </div>

    <main class="container mx-auto px-4 py-8 page-enter-active">
        <section class="flex flex-wrap gap-4 mb-8">
            <div class="flex-1 min-w-[250px]">
                <input type="text" id="search" placeholder="Search books..." 
                    class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <select id="genre-filter" 
                    class="px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
                    <option value="">All Genres</option>
                    <!-- Genres will be populated dynamically -->
                </select>
                <button id="clear-preferences" class="mt-4 px-4 py-2 bg-gray-200 text-gray-700 rounded-md hover:bg-gray-300 transition-colors">
                    Reset Filters
                </button>
            </div>
        </section>

        <section id="books-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 mb-8">
            <!-- Books will be loaded here -->
        </section>

        <div id="loader" class="fixed inset-0 flex items-center justify-center bg-white bg-opacity-75 z-50 hidden">
            <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-indigo-500"></div>
        </div>

        <section class="flex justify-center items-center gap-4 mt-8">
            <button id="prev-page" disabled 
                class="px-4 py-2 border border-gray-300 rounded-md disabled:opacity-50 disabled:cursor-not-allowed">
                Previous
            </button>
            <div id="page-numbers" class="flex gap-2"></div>
            <button id="next-page" 
                class="px-4 py-2 border border-gray-300 rounded-md">
                Next
            </button>
        </section>
      
    </main>

    <script src="js/main.js"></script>
</body>
</html>
